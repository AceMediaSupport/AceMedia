name: Daily GHL Lead Scraper

on:
  schedule:
    - cron: '0 7 * * *'   # 2 AM CST (7 AM UTC) every day
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node ghl/scraper.js

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghl-leads-${{ github.run_id }}
          path: watched/*.csv
          retention-days: 30

      - name: Commit state tracker + CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ghl/state-tracker.json
          git add -f watched/*.csv
          git diff --staged --quiet || git commit -m "Daily scrape: $(date +%Y-%m-%d) [${{ env.STATE }}]"
          git push
        env:
          STATE: ${{ env.STATE }}
